services:
  - type: web
    name: skaiz-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FORCE_REVEAL
        value: false
